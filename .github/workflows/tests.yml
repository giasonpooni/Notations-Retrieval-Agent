name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.10.10"
      # The public core has no runtime dependencies. Install its declared dev
      # group directly so uv does not resolve optional private kernel extras.
      # The separate kernels job retains the complete pinned integration gate.
      - name: Install public core and declared development dependencies
        run: uv pip install --system --python ${{ matrix.python }} . --group dev
      - name: Run quickstart
        run: python examples/quickstart.py
      - name: Run unknown-plant example
        run: python examples/unknown_plant.py
      - name: Build package
        run: uv build --python ${{ matrix.python }}
      - name: Run default suite
        run: python -m pytest -q

  kernels:
    name: pinned kernels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.10.10"
      - name: Install pinned extras and run live kernel tests in the same environment
        run: uv run --python 3.13 --dev --extra kernels pytest -q -m live
